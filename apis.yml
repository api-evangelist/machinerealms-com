- aid: machinerealms-com:a2a-agent
  name: Machine Realms A2A Agent
  description: >-
    Agent2Agent 1.0 surface: an agent card at https://machinerealms.com/.well-known/agent-card.json (version
    network-alpha-2) declaring two interfaces — JSON-RPC at https://machinerealms.com/a2a and HTTP+JSON
    at /a2a/v1 — and twelve read-only skills: network registry, realm evidence, machine-readable offers,
    authority boundary, intent match, capability vocabulary, agent counterparty contract, machine-native
    experience research, research data exchange, research intelligence, Research Commons and bounded research
    quests. The JSON-RPC endpoint answers tasks/get with A2A error -32001 task_not_found for an unknown
    id; streaming, push notifications and the extended card are declared unsupported; the card grants
    no write authority.
  humanURL: https://machinerealms.com/network
  baseURL: https://machinerealms.com/a2a
