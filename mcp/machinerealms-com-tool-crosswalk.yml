summary: >-
  Machine Realms' three agent surfaces do not project one another; they partition the estate. The MCP server
  exposes three Moltbook telemetry tools and nine read resources, none of which is an operation in the published
  OpenAPI. The OpenAPI covers only the Research Commons (27 operations, 14 of them scoped writes) and no MCP tool
  or A2A skill performs any of those writes — the provider says so (research-commons.json:
  scoped_write_api_separate_from_read_only_mcp true; the agent card: "This Agent Card grants no write
  authority"). The read side overlaps three ways: MCP resources and A2A skills both describe registry, evidence,
  offers, capability-vocabulary and research data that the public /api/v1 index serves as plain HTTP+JSON but
  that is NOT in the OpenAPI, and two A2A skills (research-commons, bounded-research-quests) describe the same
  rooms/quests the OpenAPI's public GETs serve. Every binding below is by name and semantics; no tool or skill
  was invoked.
