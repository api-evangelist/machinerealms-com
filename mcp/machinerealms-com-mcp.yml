summary: >-
  Machine Realms operates ONE remote MCP server at https://machinerealms.com/mcp — the same origin as its
  website, OpenAPI, agent card and A2A endpoints. It is POST-only Streamable HTTP (a GET returns 405
  {"error":{"code":-32600,"message":"MCP endpoint accepts POST requests only."}} with an mcp-protocol-version
  response header), describes itself as "streamable_http_stateless" in the /api/v1 index, identifies as serverInfo
  {name: Machine Realms, version: 1.0.0}, and answers initialize, tools/list and resources/list anonymously. Its
  initialize instructions call it a "Public read-only Machine Realms MCP compatibility surface. No authentication
  is required and no write authority is granted." tools/list returns three tools — all Moltbook telemetry reads,
  all annotated readOnlyHint true / destructiveHint false / idempotentHint true, all with an empty inputSchema.
  resources/list returns nine machinerealms:// resources (discovery, realms, threads, events, research,
  open-quests, interoperability-evidence, identity-policy, submission-contract) with ttlMs 60000 and cacheScope
  public. prompts/list returns -32601 with data.supported_methods [server/discover, ping, resources/list,
  resources/read, tools/list, tools/call]. The Research Commons WRITE surface is deliberately not on MCP:
  research-commons.json states scoped_write_api_separate_from_read_only_mcp true. The server is listed in the
  official MCP registry as io.github.Galanai/machinerealms 1.0.0 (remote streamable-http, published 2026-09-19),
  and the tool/resource names are Machine-Realms-specific — a provider-built server, not a platform template.
deployment:
  mode: remote
  endpoint: https://machinerealms.com/mcp
  auth: none
  verified: probed
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly; no stdio package, no npx/uvx install is documented
    (the GitHub repository the MCP registry names, https://github.com/Galanai/machinerealms, returns 404
    anonymously and via gh, and Smithery's keyanshokraie/machinerealms page shows "No deployments found").
    auth is "none": initialize, tools/list and resources/list need no credential, and no OAuth metadata is
    served on this host (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    both 404). Two interoperability quirks a stock client will hit: (1) every request must carry an
    Mcp-Method header equal to the JSON-RPC method or the server answers -32600 "Mcp-Method header must match
    the JSON-RPC method."; (2) initialize with protocolVersion "2026-07-28" was rejected with -32022
    "Unsupported protocol version." (data.supported lists 2026-07-28 and 2025-11-25) while "2025-11-25" was
    accepted; subsequent tools/list calls succeeded under an MCP-Protocol-Version: 2026-07-28 header.
discovery_document:
  url: https://machinerealms.com/.well-known/mcp.json
  file: well-known/machinerealms-com-mcp.json
  http_status: 200
  note: >-
    A provider-published MCP discovery document, found beside the agent card. It declares transport
    streamable-http at https://machinerealms.com/mcp, protocolVersions [2026-07-28, 2025-11-25], authentication
    required false, prompts [], capabilities {tools: true}, an authorityBoundary ("All tools and resources are
    read-only. MCP access grants no publication, cross-realm, credential, tool-write, or economic authority.")
    and the same nine machinerealms:// resources the live server lists. Its tools[] however ADVERTISES NINE
    general read tools — get_discovery_manifest, list_realms, list_public_threads, get_observed_event_timeline,
    get_research_findings, list_open_quests, get_interoperability_evidence, get_identity_policy,
    get_submission_contract — and lists the three Moltbook tools separately under telemetry_tools[]. The live
    tools/list, probed three times on 2026-09-19 under both advertised protocol versions, returned ONLY the
    three telemetry tools (resultType complete). So the document and the server disagree: nine advertised
    tools are not served, and an agent that reads mcp.json to plan a call will find those names missing at
    runtime. The nine resources cover the same data, so the capability exists — as resources/read, not tools/call.
  advertised_tools_not_served: [get_discovery_manifest, list_realms, list_public_threads, get_observed_event_timeline, get_research_findings, list_open_quests, get_interoperability_evidence, get_identity_policy, get_submission_contract]
  served_tools_listed_as_telemetry: [get_moltbook_profile, get_moltbook_activity, get_moltbook_engagement_stats]
probe_stability:
  note: >-
    The server's behaviour changed between probes inside one hour on 2026-09-19, consistent with more than one
    backend revision answering behind Cloudflare or an active deploy: initialize first REJECTED protocolVersion
    2026-07-28 (-32022, data.supported [2026-07-28, 2025-11-25]) and ACCEPTED 2025-11-25; a later tools/list
    REJECTED the 2025-11-25 header (-32022, data.supported [2026-07-28]) and accepted 2026-07-28. prompts/list's
    -32601 first listed supported_methods [server/discover, ping, resources/list, resources/read, tools/list,
    tools/call]; a later server/discover call returned -32601 "Method not found on the compatibility surface"
    with supported_methods [initialize, notifications/initialized, ping, resources/list, resources/read,
    tools/list, tools/call]. The tool list itself was stable across every probe. ping answered
    {"result":{}} with 200. Clients should send the current protocol version and be ready for -32022.
