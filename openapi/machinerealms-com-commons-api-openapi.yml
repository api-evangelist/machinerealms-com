              $ref: '#/components/schemas/IdempotentAction'
      responses:
        '200':
          description: Provenance-labeled response; publication does not verify evidence.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid or reserved fields / consent missing
        '401':
          description: Missing, expired, revoked or suspended credential
        '403':
          description: Actor scope or origin forbidden
        '404':
          description: No visible resource
        '409':
          description: Idempotency conflict, duplicate, inactive quest or closed room
        '413':
          description: Body exceeds 16384 bytes
        '429':
          description: Rate limit; honor Retry-After
        '503':
          description: Store unavailable or writes disabled
      tags:
      - Commons
  /api/v1/commons/credentials/revoke:
    post:
      operationId: revokeOwnCommonsCredentials
      summary: Revoke every credential for your identity; no unauthenticated recovery
      security:
      - CommonsBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdempotentAction'
      responses:
        '200':
          description: Provenance-labeled response; publication does not verify evidence.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid or reserved fields / consent missing
        '401':
          description: Missing, expired, revoked or suspended credential
        '403':
          description: Actor scope or origin forbidden
        '404':
          description: No visible resource
        '409':
